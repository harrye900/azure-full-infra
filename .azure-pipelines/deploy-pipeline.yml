trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  acrLoginServer: ecommerceacr.azurecr.io

steps:
  - task: AzureCLI@2
    displayName: Get latest build tag from ACR
    inputs:
      azureSubscription: azure-service-connection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        TAG=$(az acr repository show-tags \
          --name ecommerceacr \
          --repository frontend \
          --orderby time_desc \
          --top 1 \
          --output tsv | grep -v latest)
        echo "Latest image tag: $TAG"
        echo "##vso[task.setvariable variable=imageTag]$TAG"

  - task: AzureCLI@2
    displayName: Get AKS credentials
    inputs:
      azureSubscription: azure-service-connection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az aks get-credentials \
          --resource-group ecommerce-rg \
          --name ecommerce-aks \
          --overwrite-existing

  - task: HelmDeploy@0
    displayName: Helm upgrade --install
    inputs:
      connectionType: None
      namespace: default
      command: upgrade
      chartType: FilePath
      chartPath: helm/ecommerce
      releaseName: ecommerce
      install: true
      waitForExecution: false
      arguments: >
        --timeout 5m
        --set frontend.image=$(acrLoginServer)/frontend:$(imageTag)
        --set productService.image=$(acrLoginServer)/product-service:$(imageTag)
        --set orderService.image=$(acrLoginServer)/order-service:$(imageTag)

  - task: AzureCLI@2
    displayName: Check pod status
    inputs:
      azureSubscription: azure-service-connection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az aks get-credentials \
          --resource-group ecommerce-rg \
          --name ecommerce-aks \
          --overwrite-existing
        kubectl get pods -n default
        kubectl get services -n default
