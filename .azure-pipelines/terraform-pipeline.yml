trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  vmImage: ubuntu-latest

variables:
  - group: ecommerce

steps:
  - task: AzureCLI@2
    displayName: Bootstrap - Create storage account for Terraform state
    inputs:
      azureSubscription: azure-service-connection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az group create --name ecommerce-rg --location eastus
        az storage account create \
          --name ecommercetfstate23 \
          --resource-group ecommerce-rg \
          --sku Standard_LRS \
          --location eastus
        az storage container create \
          --name tfstate \
          --account-name ecommercetfstate23
        echo "Bootstrap complete"

  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: TerraformTaskV4@4
    displayName: Terraform Init
    inputs:
      provider: azurerm
      command: init
      workingDirectory: $(System.DefaultWorkingDirectory)/terraform
      backendServiceArm: azure-service-connection
      backendAzureRmResourceGroupName: ecommerce-rg
      backendAzureRmStorageAccountName: ecommercetfstate23
      backendAzureRmContainerName: tfstate
      backendAzureRmKey: terraform.tfstate

  - bash: |
      cd $(System.DefaultWorkingDirectory)/terraform
      export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
      export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
      export ARM_TENANT_ID=$(ARM_TENANT_ID)
      export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
      if ! terraform state show module.aks.azurerm_resource_group.rg 2>/dev/null; then
        echo "Importing resource group into state..."
        terraform import module.aks.azurerm_resource_group.rg \
          /subscriptions/$(ARM_SUBSCRIPTION_ID)/resourceGroups/ecommerce-rg
      else
        echo "Resource group already in state, skipping import"
      fi
    displayName: Import existing resource group into Terraform state

  - task: TerraformTaskV4@4
    displayName: Terraform Plan
    name: plan
    inputs:
      provider: azurerm
      command: plan
      workingDirectory: $(System.DefaultWorkingDirectory)/terraform
      environmentServiceNameAzureRM: azure-service-connection

  - task: TerraformTaskV4@4
    displayName: Terraform Apply
    condition: ne(variables['plan.changesPresent'], 'false')
    inputs:
      provider: azurerm
      command: apply
      workingDirectory: $(System.DefaultWorkingDirectory)/terraform
      environmentServiceNameAzureRM: azure-service-connection
