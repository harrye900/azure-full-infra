apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: {{ .Values.orderService.replicas }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: {{ .Values.orderService.image }}
          ports:
            - containerPort: {{ .Values.orderService.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.orderService.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: {{ .Values.orderService.service.type }}
  selector:
    app: order-service
  ports:
    - port: {{ .Values.orderService.service.port }}
      targetPort: {{ .Values.orderService.port }}
